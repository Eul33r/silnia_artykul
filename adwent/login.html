
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie | Matematyczny Adwent 2026</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #f8fafc;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border: 1px solid #334155;
            border-radius: 16px;
            background: #1e293b;
        }

        h1 {
            margin-top: 0;
            font-size: 25px;
            text-align: center;
        }

        .subtitle {
            color: #cbd5e1;
            text-align: center;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            margin-top: 20px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .success {
            color: #86efac;
        }

        .error {
            color: #fca5a5;
        }
    </style>
</head>

<body>

    <main class="login-box">
        <h1>🎄 Matematyczny Adwent</h1>

        <p class="subtitle">
            Zaloguj się, aby otworzyć swój kalendarz.
        </p>

        <form id="login-form">
            <label for="email">Adres e-mail</label>
            <input
                type="email"
                id="email"
                required
                autocomplete="username"
            >

            <label for="password">Hasło</label>
            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
            >

            <button type="submit" id="login-button">
                Zaloguj się
            </button>
        </form>

        <div id="status" aria-live="polite"></div>
    </main>

    <script type="module">
        import { supabase } from './js/supabase.js';

        const form = document.querySelector('#login-form');
        const button = document.querySelector('#login-button');
        const status = document.querySelector('#status');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            button.disabled = true;
            status.textContent = 'Trwa logowanie...';
            status.className = '';

            const email = document.querySelector('#email').value.trim();
            const password = document.querySelector('#password').value;

            try {
                // Logowanie użytkownika
                const { data, error } =
                    await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) {
                    throw error;
                }

                // Pobranie własnego profilu z bazy
                const { data: profile, error: profileError } =
                    await supabase
                        .from('profiles')
                        .select('display_name, role, class_name')
                        .eq('id', data.user.id)
                        .single();

                if (profileError) {
                    throw profileError;
                }

                status.className = 'success';

                status.textContent =
                    `Witaj, ${profile.display_name}! ` +
                    `Twoja rola: ${profile.role}. ` +
                    'Logowanie i połączenie z bazą działają poprawnie.';
                    
                
                // form.reset();
                window.location.href = './dashboard.html';

            } catch (error) {
                console.error(error);

                status.className = 'error';
                status.textContent =
                    'Nie udało się zalogować: ' + error.message;

            } finally {
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
